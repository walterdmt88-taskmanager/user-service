name: Deploy Staging (manual)
on:
  workflow_dispatch:
    inputs:
      image-tag:
        description: "Commit SHA to deploy (copy from a pr-merged.yml build run)"
        type: string
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    uses: walterdmt88-taskmanager/proops2026-cicd-platform/.github/workflows/reusable-deploy.yml@v4.0.1
    with:
      image-tag: ${{ inputs.image-tag }}
      environment: staging
      service-name: "user-service"
      ecr-repository: "taskmanager/user-service"
      aws-role-arn: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
      aws-region: "ap-southeast-1"
      secret-name: "user-svc-secret"
      secret-literals: >-
        --from-literal=DATABASE_URL=postgresql://dummy:dummy@localhost:5432/dummy
        --from-literal=JWT_SECRET=ci-stub-secret-minimum-32-chars-long
